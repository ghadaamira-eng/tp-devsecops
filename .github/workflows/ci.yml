name: CI/CD - democyber

# Declenche le workflow sur push ou pull request vers main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Droits minimaux pour le jeton GITHUB_TOKEN
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # Recuperer le code (historique complet, necessaire pour Gitleaks)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks scan (avant la compilation)
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sauvegarder le rapport Gitleaks (meme si le scan echoue)
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      # Installer Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compiler le code Java
      - name: Compile Java
        run: mvn compile

      # Construire le projet Maven
      - name: Build Java project with Maven
        run: mvn clean package

      # Connexion a Docker Hub avec le token
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire l'image Docker
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # Afficher nom, tag et taille de l'image
      - name: Show Docker image details
        run: docker images $DOCKER_IMAGE_NAME

      # Tester l'image avant de la publier
      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME
          curl -f --retry 15 --retry-all-errors --retry-delay 3 http://localhost:8080
          docker stop democyber-test
          docker rm democyber-test

      # Trivy scan : analyse des vulnerabilites de l'image avant publication
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Publier l'image (uniquement sur push vers main)
      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push $DOCKER_IMAGE_NAME