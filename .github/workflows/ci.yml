name: CI/CD - democyber

# Declenche le workflow sur push ou pull request vers main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # Recuperer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installer Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compiler le code Java
      - name: Compile Java
        run: mvn compile

      # Construire le projet Maven
      - name: Build Java project with Maven
        run: mvn clean package

      # Connexion a Docker Hub avec le token
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire l'image Docker
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # Tester l'image avant de la publier
      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME
          curl -f --retry 10 --retry-connrefused --retry-delay 3 http://localhost:8080
          docker stop democyber-test

      # Publier l'image (uniquement sur push vers main)
      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push $DOCKER_IMAGE_NAME